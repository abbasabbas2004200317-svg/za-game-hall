
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZA Game Hall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0c0b12;--panel:#171521;--line:#373047;--text:#f7f4ff;--muted:#aaa3bb;--purple:#a78bfa;--green:#55d6a0;--red:#ff737d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
header{padding:16px;background:#11101a;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:20px;font-weight:bold}.brand span{color:var(--purple)}
main{max-width:1100px;margin:auto;padding:18px 12px}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:18px;margin-top:0}
input,button{font:inherit;border-radius:9px;padding:12px;width:100%;margin-top:8px}
input{background:#100e18;color:white;border:1px solid var(--line)}
button{background:#29223a;color:white;border:1px solid var(--line);cursor:pointer}
button.primary{background:var(--purple);color:#171020;font-weight:bold;border:0}
button.end{color:#ffc2c5;border-color:#71343b}
button:disabled{opacity:.5}
#login{max-width:440px;margin:35px auto}
.hidden{display:none!important}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
.filters button{width:auto;margin:0;padding:9px 12px}
.filters button.active{background:var(--purple);color:#171020}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:12px}
.stat small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card h3{margin:0 0 12px;font-size:16px}
.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;background:#163b2d;color:#8cf0bf}
.pill.busy{background:#33264b;color:#dbcaff}
.detail{color:var(--muted);font-size:13px;line-height:1.9;margin-top:12px;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
#message{margin-top:12px;font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.error{color:#ff929a}.success{color:var(--green)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:10px}.stat strong{font-size:20px}.brand{font-size:16px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand"><span>ZA</span> Game Hall</div>
    <div class="muted">إدارة أجهزة القاعة</div>
  </div>
  <button id="logout" class="hidden" style="width:auto;margin:0">تسجيل خروج</button>
</header>

<main>
  <section id="login" class="panel">
    <h2>تسجيل دخول الموظف</h2>
    <p class="muted">سجّل الدخول بالحساب الذي أنشأه مسؤول القاعة.</p>
    <form id="loginForm">
      <label for="email">الإيميل</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" class="primary" type="submit">دخول</button>
    </form>
    <div id="loginMessage" class="muted"></div>
  </section>

  <section id="app" class="hidden">
    <div class="stats">
      <div class="stat"><small>كل المواقع</small><strong id="total">0</strong></div>
      <div class="stat"><small>مشغول</small><strong id="busy">0</strong></div>
      <div class="stat"><small>متاح</small><strong id="free">0</strong></div>
    </div>
    <h2>الأجهزة والطاولات</h2>
    <p class="muted">حالة الأجهزة تتحدث تلقائياً كل عدة ثوانٍ.</p>
    <div class="filters" id="filters">
      <button class="active" data-filter="الكل">الكل</button>
      <button data-filter="PC">PC</button>
      <button data-filter="PlayStation">PlayStation</button>
      <button data-filter="بليارد">بليارد</button>
      <button data-filter="VIP">VIP</button>
    </div>
    <div id="resources" class="grid"></div>
    <div id="message" role="status"></div>
  </section>
</main>
<footer>ZA Game Hall — نظام إدارة القاعة</footer>

<script>
/* استبدل النص أدناه بمفتاح Publishable من مشروعك */
const SUPABASE_URL = 'https://kgwojfxzdmhynsxtekho.supabase.co';
const SUPABASE_KEY = 'PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let devices = [];
let filter = 'الكل';
let currentUser = null;
let busyAction = false;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function showMessage(text, error=false) {
  $('message').textContent = text;
  $('message').className = error ? 'error' : 'success';
}

function category(device) {
  const value = String(device.device_type || device.type || device.name || '').toLowerCase();
  if (value.includes('playstation') || value.includes('بلاي')) return 'PlayStation';
  if (value.includes('بليارد') || value.includes('billiard')) return 'بليارد';
  if (value.includes('vip')) return 'VIP';
  if (value.includes('pc') || value.includes('كمبيوتر')) return 'PC';
  return device.device_type || 'أخرى';
}

function isBusy(device) {
  return String(device.status || '').toLowerCase() !== 'available';
}

function formatTime(value) {
  if (!value) return 'غير مسجل';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return 'غير مسجل';
  return date.toLocaleString('ar-IQ', {
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit'
  });
}

function render() {
  const busy = devices.filter(isBusy).length;
  $('total').textContent = devices.length;
  $('busy').textContent = busy;
  $('free').textContent = devices.length - busy;

  const shown = devices.filter(d => filter === 'الكل' || category(d) === filter);
  if (!shown.length) {
    $('resources').innerHTML =
      '<div class="panel muted">ماكو أجهزة بهذا القسم بقاعدة البيانات حالياً.</div>';
    return;
  }

  $('resources').innerHTML = shown.map(d => {
    const active = isBusy(d);
    const name = d.name || (category(d) + ' ' + (d.device_number ?? d.id));
    return `<article class="card">
      <h3>${escapeHtml(name)}</h3>
      <span class="pill ${active ? 'busy' : ''}">${active ? 'مشغول' : 'متاح'}</span>
      <div class="detail">
        وقت البداية: ${escapeHtml(formatTime(d.session_started_at))}<br>
        وقت النهاية: ${escapeHtml(formatTime(d.session_ended_at))}
      </div>
      ${active
        ? `<button class="end" data-action="end" data-id="${escapeHtml(d.id)}" ${busyAction?'disabled':''}>إنهاء الجلسة</button>`
        : `<button class="primary" data-action="start" data-id="${escapeHtml(d.id)}" ${busyAction?'disabled':''}>بدء الجلسة</button>`
      }
    </article>`;
  }).join('');
}

async function loadDevices() {
  if (!currentUser) return;
  const { data, error } = await db
    .from('devices')
    .select('*')
    .order('name', { ascending: true });

  if (error) {
    showMessage('تعذّر تحميل الأجهزة: ' + error.message, true);
    return;
  }
  devices = data || [];
  render();
}

async function setSession(id, start) {
  if (!currentUser || busyAction) return;
  const device = devices.find(d => String(d.id) === String(id));
  if (!device) return;

  if (start && isBusy(device)) {
    showMessage('هذا الجهاز مشغول بالفعل.', true);
    return;
  }
  if (!start && !isBusy(device)) {
    showMessage('هذا الجهاز متاح بالفعل.', true);
    return;
  }

  const now = new Date().toISOString();
  const changes = start
    ? { status:'busy', session_started_at:now, session_ended_at:null }
    : { status:'available', session_ended_at:now };

  busyAction = true;
  render();
  showMessage('جارٍ حفظ التغيير...');

  const { error } = await db.from('devices').update(changes).eq('id', device.id);

  busyAction = false;
  if (error) {
    showMessage('لم يُحفظ التغيير: ' + error.message, true);
    await loadDevices();
    return;
  }

  showMessage(start ? 'تم تسجيل بداية الجلسة.' : 'تم إنهاء الجلسة وإتاحة الجهاز.');
  await loadDevices();
}

$('resources').addEventListener('click', async event => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  await setSession(button.dataset.id, button.dataset.action === 'start');
});

$('filters').addEventListener('click', event => {
  const button = event.target.closest('button[data-filter]');
  if (!button) return;
  filter = button.dataset.filter;
  document.querySelectorAll('#filters button').forEach(b =>
    b.classList.toggle('active', b === button)
  );
  render();
});

function showApp(user) {
  currentUser = user || null;
  $('login').classList.toggle('hidden', !!user);
  $('app').classList.toggle('hidden', !user);
  $('logout').classList.toggle('hidden', !user);
  if (user) {
    $('loginMessage').textContent = '';
    loadDevices();
  } else {
    devices = [];
    $('resources').innerHTML = '';
  }
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  $('loginBtn').disabled = true;
  $('loginMessage').textContent = 'جارٍ تسجيل الدخول...';

  const { data, error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });

  $('loginBtn').disabled = false;
  if (error) {
    $('loginMessage').textContent = 'تعذّر الدخول. تأكد من الإيميل وكلمة المرور وأن حساب الموظف موجود.';
    return;
  }
  showApp(data.user);
});

$('logout').addEventListener('click', async () => {
  await db.auth.signOut();
  showApp(null);
});

db.auth.onAuthStateChange((_event, session) => {
  showApp(session?.user || null);
});

async function init() {
  if (!SUPABASE_KEY.startsWith('sb_publishable_') ||
      SUPABASE_KEY === 'PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE') {
    $('loginMessage').textContent = 'أضف مفتاح Publishable الخاص بمشروعك في موضعه داخل الكود.';
    return;
  }
  const { data, error } = await db.auth.getSession();
  if (error) {
    $('loginMessage').textContent = 'تعذّر التحقق من الجلسة. راجع إعدادات Supabase.';
    return;
  }
  showApp(data.session?.user || null);
}

setInterval(() => {
  if (currentUser && !busyAction) loadDevices();
}, 10000);

init();
</script>
</body>
</html>
